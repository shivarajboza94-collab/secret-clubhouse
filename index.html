<!DOCTYPE html>
<html>
<head>
  <title>Agent Clubhouse - Classified</title>
  <style>
    body { background: #0b0f19; color: #38bdf8; font-family: monospace; text-align: center; padding-top: 50px; }
    .badge { display: inline-block; border: 3px solid #38bdf8; padding: 30px 45px; border-radius: 16px; box-shadow: 0 0 30px #0284c7; background: #111827; }
    h1 { font-size: 2.2rem; margin-bottom: 12px; color: #38bdf8; }
    p { font-size: 1.1rem; color: #e2e8f0; margin: 8px 0; }
    .status { color: #4ade80; font-weight: bold; }
    .codename { color: #f59e0b; font-weight: bold; }
    .clearance { display: inline-block; margin-top: 15px; padding: 6px 14px; background: #dc2626; color: #fff; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="badge">
    <h1>🕵️ SECRET AGENT HQ</h1>
    <p>Agent Codename: <span class="codename">SHADOW-94</span></p>
    <p>Network Status: <span class="status">ENCRYPTED & ONLINE</span></p>
    <div class="clearance">TOP SECRET // LEVEL 5 CLEARANCE</div>
  </div>
</body>
</html>
