<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Clubhouse - Classified</title>
  <style>
    body {
      background: #0b0f19;
      color: #38bdf8;
      font-family: monospace;
      text-align: center;
      padding-top: 50px;
    }
    .badge {
      display: inline-block;
      border: 3px solid #38bdf8;
      padding: 30px 45px;
      border-radius: 16px;
      box-shadow: 0 0 30px #0284c7;
      background: #111827;
      max-width: 500px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    p {
      font-size: 1.1rem;
      color: #e2e8f0;
      margin: 8px 0;
    }
    .status {
      color: #4ade80;
      font-weight: bold;
    }
    .codename {
      color: #f59e0b;
      font-weight: bold;
    }
    .clearance {
      display: inline-block;
      margin-top: 15px;
      padding: 6px 14px;
      background: #dc2626;
      color: #fff;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    /* Button and secret mission styling */
    .secret-btn {
      margin-top: 25px;
      padding: 12px 24px;
      font-family: monospace;
      font-size: 1rem;
      font-weight: bold;
      color: #38bdf8;
      background: transparent;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .secret-btn:hover {
      background: #38bdf8;
      color: #0b0f19;
      box-shadow: 0 0 15px #38bdf8;
    }
    #mission-brief {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border: 1px dashed #4ade80;
      border-radius: 8px;
      background: #064e3b;
      color: #a7f3d0;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="badge">
    <h1>🕵️ SECRET AGENT HQ</h1>
    <p>Agent Codename: <span class="codename">SHADOW-94</span></p>
    <p>Network Status: <span class="status">ENCRYPTED & ONLINE</span></p>
    <div class="clearance">TOP SECRET // LEVEL 5 CLEARANCE</div>

    <div>
      <button class="secret-btn" id="toggle-btn" onclick="toggleMission()">🔓 REVEAL SECRET MISSION</button>
    </div>

    <div id="mission-brief">
      <p style="color: #6ee7b7; font-weight: bold; margin-top: 0;">⚡ CLASSIFIED DIRECTIVE:</p>
      <p>Target: Master Git workflows and cloud deployments.</p>
      <p>Tooling: Git Bash + GitHub Pages.</p>
      <p>Self-destruct timer: None. Keep hacking.</p>
    </div>
  </div>

  <script>
    function toggleMission() {
      const mission = document.getElementById("mission-brief");
      const button = document.getElementById("toggle-btn");

      if (mission.style.display === "block") {
        mission.style.display = "none";
        button.innerText = "🔓 REVEAL SECRET MISSION";
        button.style.borderColor = "#38bdf8";
        button.style.color = "#38bdf8";
      } else {
        mission.style.display = "block";
        button.innerText = "🔒 LOCK CLASSIFIED DIRECTIVE";
        button.style.borderColor = "#f87171";
        button.style.color = "#f87171";
      }
    }
  </script>
</body>
</html>
