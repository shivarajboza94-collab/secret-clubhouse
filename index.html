<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Clubhouse - Audio & FX Protocol</title>
  <style>
    body {
      background: #0b0f19;
      color: #38bdf8;
      font-family: monospace;
      text-align: center;
      padding-top: 40px;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.3s ease;
    }

    /* Screen shake earthquake effect */
    .screen-shake {
      animation: earthquake 0.75s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes earthquake {
      10%, 90% { transform: translate3d(-6px, -3px, 0) rotate(-0.5deg); }
      20%, 80% { transform: translate3d(8px, 5px, 0) rotate(1deg); }
      30%, 50%, 70% { transform: translate3d(-10px, -6px, 0) rotate(-1.2deg); }
      40%, 60% { transform: translate3d(10px, 6px, 0) rotate(1.2deg); }
    }

    .badge {
      display: inline-block;
      border: 3px solid #38bdf8;
      padding: 30px 45px;
      border-radius: 16px;
      box-shadow: 0 0 30px #0284c7;
      background: #111827;
      max-width: 520px;
      transition: all 0.3s ease;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #38bdf8;
    }
    p {
      font-size: 1.05rem;
      color: #e2e8f0;
      margin: 8px 0;
    }
    .status { color: #4ade80; font-weight: bold; }
    .codename { color: #f59e0b; font-weight: bold; }
    .clearance {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 14px;
      background: #dc2626;
      color: #fff;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .action-row {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    button {
      padding: 10px 18px;
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-destruct {
      background: #ef4444;
      color: #ffffff;
      border: 2px solid #b91c1c;
    }
    .btn-destruct:hover {
      background: #dc2626;
      box-shadow: 0 0 15px #ef4444;
    }
    .btn-abort {
      display: none;
      background: #eab308;
      color: #000;
      border: 2px solid #ca8a04;
    }
    .btn-abort:hover {
      background: #facc15;
      box-shadow: 0 0 15px #eab308;
    }
    #timer-display {
      display: none;
      margin-top: 25px;
      font-size: 3rem;
      font-weight: bold;
      color: #f87171;
      text-shadow: 0 0 20px #ef4444;
      letter-spacing: 4px;
    }

    /* CRT Monitor Frame & Static Glitch Effect */
    #destroyed-screen {
      display: none;
      position: relative;
      margin-top: 20px;
      padding: 24px 20px;
      border: 2px solid #ef4444;
      background: #1c0505;
      color: #fca5a5;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 35px rgba(239, 68, 68, 0.4);
    }

    /* Horizontal micro-scanlines */
    #destroyed-screen::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.6) 50%,
        rgba(0, 0, 0, 0.6)
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
    }

    /* Rolling static beam line */
    #destroyed-screen::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 100%;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(248, 113, 113, 0.15) 50%,
        transparent 95%
      );
      animation: crt-roll 2.5s linear infinite;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes crt-roll {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    /* Chromatic aberration glitch text */
    .glitch-text {
      position: relative;
      margin: 0;
      color: #f87171;
      font-size: 1.5rem;
      font-weight: bold;
      animation: glitch-flicker 1.2s infinite steps(2, start);
    }

    @keyframes glitch-flicker {
      0% {
        text-shadow: 2px 0 #38bdf8, -2px 0 #ef4444;
        transform: translate(0, 0);
      }
      25% {
        text-shadow: -3px 0 #38bdf8, 3px 0 #ef4444;
        transform: translate(-2px, 1px);
      }
      50% {
        text-shadow: 2px -1px #38bdf8, -1px 2px #ef4444;
        transform: translate(1px, -1px);
      }
      75% {
        text-shadow: -2px 1px #38bdf8, 2px -1px #ef4444;
        transform: translate(-1px, 2px);
      }
      100% {
        text-shadow: 2px 0 #38bdf8, -2px 0 #ef4444;
        transform: translate(0, 0);
      }
    }

    .critical-alarm {
      animation: flash-red 0.8s infinite alternate;
    }
    @keyframes flash-red {
      0% { box-shadow: 0 0 25px #ef4444; border-color: #ef4444; }
      100% { box-shadow: 0 0 50px #b91c1c; border-color: #7f1d1d; }
    }
  </style>
</head>
<body>
  <div class="badge" id="hq-card">
    <h1>🕵️ SECRET AGENT HQ</h1>
    <p>Agent Codename: <span class="codename">SHADOW-94</span></p>
    <p>Network Status: <span class="status" id="net-status">ENCRYPTED & ONLINE</span></p>
    <div class="clearance" id="clearance-tag">TOP SECRET // LEVEL 5 CLEARANCE</div>

    <div id="content-block">
      <div id="timer-display">00:10</div>

      <div class="action-row">
        <button class="btn-destruct" id="start-btn" onclick="startSelfDestruct()">💣 ACTIVATE SELF-DESTRUCT</button>
        <button class="btn-abort" id="abort-btn" onclick="abortSelfDestruct()">🛑 ABORT SEQUENCE</button>
      </div>
    </div>

    <div id="destroyed-screen">
      <h2 class="glitch-text">💥 SYSTEM PURGED</h2>
      <p style="margin: 12px 0 18px 0; position: relative; z-index: 4;">All agent logs and classified databases have been erased.</p>
      <button onclick="resetSystem()" style="background: #38bdf8; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; position: relative; z-index: 4;">🔄 REBOOT HQ</button>
    </div>
  </div>

  <script>
    let timeLeft = 10;
    let timerId = null;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type = "sine", volume = 0.2) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);

        gain.gain.setValueAtTime(volume, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    }

    function playAbortSound() {
      [523.25, 659.25, 783.99].forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 0.25, "triangle", 0.15), idx * 120);
      });
    }

    function playPurgeBoom() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(180, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 1.2);

        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    }

    function startSelfDestruct() {
      const startBtn = document.getElementById("start-btn");
      const abortBtn = document.getElementById("abort-btn");
      const timerDisplay = document.getElementById("timer-display");
      const hqCard = document.getElementById("hq-card");
      const netStatus = document.getElementById("net-status");

      timeLeft = 10;
      timerDisplay.innerText = "00:10";
      timerDisplay.style.display = "block";
      startBtn.style.display = "none";
      abortBtn.style.display = "inline-block";

      hqCard.classList.add("critical-alarm");
      netStatus.innerText = "SELF-DESTRUCT IMMINENT";
      netStatus.style.color = "#f87171";

      playTone(600, 0.12, "square", 0.15);

      timerId = setInterval(() => {
        timeLeft--;
        const formatted = timeLeft < 10 ? "00:0" + timeLeft : "00:" + timeLeft;
        timerDisplay.innerText = formatted;

        if (timeLeft > 0) {
          const pitch = 600 + (10 - timeLeft) * 55;
          playTone(pitch, 0.1, "square", 0.18);
        } else {
          clearInterval(timerId);
          triggerDestruction();
        }
      }, 1000);
    }

    function abortSelfDestruct() {
      if (timerId) clearInterval(timerId);

      playAbortSound();

      const startBtn = document.getElementById("start-btn");
      const abortBtn = document.getElementById("abort-btn");
      const timerDisplay = document.getElementById("timer-display");
      const hqCard = document.getElementById("hq-card");
      const netStatus = document.getElementById("net-status");

      timerDisplay.style.display = "none";
      abortBtn.style.display = "none";
      startBtn.style.display = "inline-block";

      hqCard.classList.remove("critical-alarm");
      netStatus.innerText = "ABORT SUCCESSFUL // SYSTEM SECURE";
      netStatus.style.color = "#4ade80";
    }

    function triggerDestruction() {
      playPurgeBoom();

      document.body.classList.add("screen-shake");
      setTimeout(() => {
        document.body.classList.remove("screen-shake");
      }, 750);

      document.getElementById("content-block").style.display = "none";
      document.getElementById("clearance-tag").style.display = "none";
      document.getElementById("destroyed-screen").style.display = "block";

      const hqCard = document.getElementById("hq-card");
      hqCard.classList.remove("critical-alarm");
      hqCard.style.borderColor = "#ef4444";
      hqCard.style.boxShadow = "0 0 40px #7f1d1d";

      const netStatus = document.getElementById("net-status");
      netStatus.innerText = "OFFLINE // CONNECTION TERMINATED";
      netStatus.style.color = "#94a3b8";
    }

    function resetSystem() {
      playTone(440, 0.2, "sine", 0.2);

      document.body.classList.remove("screen-shake");
      document.getElementById("destroyed-screen").style.display = "none";
      document.getElementById("content-block").style.display = "block";
      document.getElementById("clearance-tag").style.display = "inline-block";
      document.getElementById("start-btn").style.display = "inline-block";
      document.getElementById("abort-btn").style.display = "none";
      document.getElementById("timer-display").style.display = "none";

      const hqCard = document.getElementById("hq-card");
      hqCard.style.borderColor = "#38bdf8";
      hqCard.style.boxShadow = "0 0 30px #0284c7";

      const netStatus = document.getElementById("net-status");
      netStatus.innerText = "ENCRYPTED & ONLINE";
      netStatus.style.color = "#4ade80";
    }
  </script>
</body>
</html>
